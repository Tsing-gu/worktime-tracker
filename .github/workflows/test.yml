# GitHub Actions CI - 持续集成
#
# 触发：push 到 main/master / 任意 PR
# 步骤：ruff check → mypy → pytest
# 环境：Ubuntu runner + Python 3.12
# 跳过：manual / macos / gui marker 的测试（Linux runner 无法跑 macOS 系统调用和图形界面）

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check src/

      - name: ruff format check
        run: ruff format --check src/

      - name: black check
        run: black --check src/

      - name: mypy
        # Phase 0 宽松模式：忽略 PySide6 存根不全 + 现有代码类型债
        # 详见 pyproject.toml [tool.mypy] 段注释
        run: |
          mypy --config-file=pyproject.toml \
            --disable-error-code=attr-defined \
            --disable-error-code=assignment \
            --disable-error-code=type-arg \
            --disable-error-code=no-any-return \
            --disable-error-code=name-defined \
            --disable-error-code=return-value \
            --disable-error-code=import-untyped \
            src/

      - name: pytest
        # 跳过 manual / macos / gui marker（Linux runner 无法跑 macOS 系统调用和图形界面）
        run: pytest -m "not manual and not macos and not gui"
