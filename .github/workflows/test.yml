# GitHub Actions CI - 持续集成
#
# 触发：push 到 main/master / 任意 PR
# 步骤：统一调用 scripts/check.sh，避免本地与 CI 命令漂移
# 环境：Ubuntu runner + Python 3.12
# 跳过：manual / macos / gui marker 的测试（Linux runner 无法跑 macOS 系统调用和图形界面）

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Quality checks
        # 脚本内部跳过 manual / macos / gui 测试，并统一 mypy 兼容参数。
        run: bash scripts/check.sh all
